<!DOCTYPE html>

<title>MEDI-TRACK – 3D Model</title>
<style>

html,body{height:100%;margin:0;overflow:hidden;background:var(--bg2);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#stage{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2) 78%)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
header{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 12px);pointer-events:none}
h1{margin:0;font-size:20px;font-weight:700}
header p{margin:2px 0 0;font-size:13px;color:var(--mut)}
#hint{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);font-size:12px;color:var(--mut);text-align:right;pointer-events:none;max-width:42vw}
#bar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 10px}
.grp{display:flex;gap:4px;background:var(--pill);border:1px solid var(--line);border-radius:12px;padding:4px;backdrop-filter:blur(6px)}
button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:0;border-radius:8px;padding:8px 11px;cursor:pointer}
button:hover{background:rgba(130,170,235,.2)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.on{background:var(--acc);color:#fff}
.tag{position:absolute;left:0;top:0;font-size:11.5px;white-space:nowrap;background:var(--pill);border:1px solid var(--line);color:var(--ink);padding:2px 7px;border-radius:6px;pointer-events:none}
.tag{transition:opacity .15s}.tag::after{content:"";position:absolute;left:50%;top:100%;width:6px;height:6px;margin:3px 0 0 -3px;border-radius:50%;background:#7fb0ff}
.tag.in{border-color:#5eead4}.tag.in::after{background:#5eead4}
#panel{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);bottom:78px;width:276px;overflow:auto;background:var(--pill);border:1px solid var(--line);border-radius:14px;padding:10px;backdrop-filter:blur(8px);z-index:5}
#panel h3{margin:12px 4px 4px;font-size:13px;font-weight:700;color:var(--mut)}
#panel .seg{display:flex;gap:4px}#panel .seg button{flex:1;border:1px solid var(--line)}
#panel .it{display:block;width:100%;text-align:left;padding:7px 9px;margin:2px 0;border-radius:8px}
#panel .it b{font-weight:600;font-size:13px}
#panel .it small{display:none;margin-top:3px;font-size:12px;line-height:1.35;color:var(--mut)}
#panel .it.on{background:rgba(255,216,74,.16);box-shadow:inset 0 0 0 1px #ffd84a}
#panel .it.on small,#panel .st small{display:block}
@media(max-width:700px){#panel{left:10px;right:10px;width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);max-height:42vh}}
